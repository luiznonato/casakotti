<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Casa Kotti — escala NPS</title>
	<link rel="stylesheet" href="../../../theme/casa-kotti/assets/css/main.css">
	<link rel="stylesheet" href="../public/feedback.css">
</head>
<body class="ck-feedback-page">
	<div class="ck-page">
		<main class="ck-content">
			<div class="ck-feedback">
				<form class="ck-feedback__form">
					<div class="ck-feedback__progress">
						<p class="ck-feedback__counter">09 / 12</p>
						<div class="ck-feedback__track"><span class="ck-feedback__fill" style="width:75%"></span></div>
					</div>
					<fieldset class="ck-feedback__step is-active" style="display:block">
						<legend class="ck-feedback__question">Você indicaria a Casa Kotti para alguém?</legend>
						<div class="ck-feedback__block" data-type="scale">
							<div class="ck-feedback__scale-wrap">
								<div class="ck-feedback__scale" role="radiogroup" data-count="11" style="--ck-scale-count:11">
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="0"><span>0</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="1"><span>1</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="2"><span>2</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="3"><span>3</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="4"><span>4</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="5"><span>5</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="6"><span>6</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="7"><span>7</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="8"><span>8</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="9"><span>9</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_0_10" value="10"><span>10</span></label>
								</div>
								<p class="ck-feedback__hint"><span>Não indicaria</span><span>Com certeza indicaria</span></p>
							</div>
						</div>
						<div class="ck-feedback__nav">
							<button type="button" class="ck-feedback__btn ck-feedback__btn--outline">Voltar</button>
							<button type="button" class="ck-feedback__btn">Continuar</button>
						</div>
					</fieldset>
					<fieldset class="ck-feedback__step" id="scale-1-10" style="display:block;margin-top:48px">
						<legend class="ck-feedback__question">Escala 1 a 10</legend>
						<div class="ck-feedback__block" data-type="scale">
							<div class="ck-feedback__scale-wrap">
								<div class="ck-feedback__scale" role="radiogroup" data-count="10" style="--ck-scale-count:10">
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="1"><span>1</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="2"><span>2</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="3"><span>3</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="4"><span>4</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="5"><span>5</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="6"><span>6</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="7"><span>7</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="8"><span>8</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="9"><span>9</span></label>
									<label class="ck-feedback__scale-item"><input type="radio" name="nps_1_10" value="10"><span>10</span></label>
								</div>
								<p class="ck-feedback__hint"><span>Não indicaria</span><span>Com certeza indicaria</span></p>
							</div>
						</div>
					</fieldset>
				</form>
			</div>
		</main>
	</div>
</body>
</html>
