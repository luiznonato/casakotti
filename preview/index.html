<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Casa Kotti — Prévia</title>
	<link rel="stylesheet" href="../theme/casa-kotti/assets/css/main.css">
</head>
<body class="ck-screen">
	<div class="background-kotti" aria-hidden="true"></div>
	<div class="ck-page ck-page--screen">
		<main class="ck-main">
			<div class="ck-brand">
				<img class="ck-brand-logo" src="../theme/casa-kotti/assets/images/logo-casa-kotti.png" alt="Casa Kotti" width="1237" height="752">
				<p class="ck-tagline">Perfumaria para ambientes</p>
			</div>
			<div class="ck-message">
				<h1>Algo <span class="ck-accent">novo</span> está prestes a ocupar o ar.</h1>
				<p>A primeira coleção Casa Kotti está chegando.<br>Cadastre-se para ser um dos primeiros a conhecer</p>
			</div>
			<div class="ck-interest">
				<form class="ck-form" action="#" method="post" data-success="Pronto! Vamos avisar você quando a Casa Kotti chegar." novalidate>
					<div class="ck-form__row">
						<label>
							<span class="ck-form__label">Seu e-mail</span>
							<input type="text" name="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" aria-required="true" maxlength="190" placeholder="Seu e-mail">
						</label>
						<button type="submit">Quero conhecer primeiro</button>
					</div>
					<label class="ck-form__consent">
						<input type="checkbox" name="consent" value="1" aria-required="true">
						<span>Aceito receber novidades sobre o lançamento da Casa Kotti por e-mail.</span>
					</label>
					<p class="ck-form__consent-error" hidden role="alert">É necessário aceitar para receber novidades.</p>
					<p class="ck-form__status" role="status" aria-live="polite" aria-atomic="true"></p>
				</form>
			</div>
		</main>
		<footer class="ck-footer">
			<nav aria-label="Links institucionais">
				<a href="#">Fale com a Casa Kotti</a>
				<a href="#">Política de privacidade</a>
			</nav>
			<p>&copy; 2026 Casa Kotti</p>
		</footer>
	</div>
	<script>
		window.ckiForm = {
			sending: 'Enviando…',
			invalidEmail: 'Digite um e-mail válido.',
			consentNeeded: 'É necessário aceitar para receber novidades.',
			genericError: 'Não foi possível cadastrar agora. Tente novamente.'
		};
	</script>
	<script src="../plugin/casa-kotti-interesses/assets/form.js"></script>
</body>
</html>
